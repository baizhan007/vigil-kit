name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: 构建并运行自测
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确认编译器可用
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          if (-not (Test-Path $csc)) {
            Write-Error "找不到 .NET Framework 的 csc.exe"
            exit 1
          }
          Write-Host "编译器: $csc"
          & $csc /? | Select-Object -First 1

      - name: 构建并运行自测
        shell: pwsh
        run: ./build.ps1

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: build/
          if-no-files-found: ignore