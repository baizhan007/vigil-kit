name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: 构建并运行自测
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 环境信息
        run: |
          "pwsh 版本            : $($PSVersionTable.PSVersion)"
          "输出是否重定向       : $([Console]::IsOutputRedirected)"
          "ErrorActionPreference: $ErrorActionPreference"

      - name: 构建并运行自测
        run: |
          # 刻意不用 Stop 模式：编译器与测试都是原生命令，
          # 让退出码由我们自己检查，避免环境差异导致误判失败。
          $ErrorActionPreference = 'Continue'

          ./build.ps1
          $code = $LASTEXITCODE
          ""
          "build.ps1 退出码: $code"

          if ($code -ne 0) { exit $code }

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/*.log
            build/*.err
            build/*.txt
          if-no-files-found: ignore
          retention-days: 7